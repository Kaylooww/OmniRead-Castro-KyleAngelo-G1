{% extends "base.html" %}
{% block content %}
<div class="card card-body mx-auto" style="max-width: 480px">
  <h2>Edit profile</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{% url 'profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
