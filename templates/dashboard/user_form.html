{% extends "base.html" %}
{% block title %}Edit User · OmniRead{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 640px">
  <div class="panel">
    <h2>Edit user</h2>
    <p class="muted">{{ member.get_full_name }} &middot; {{ member.email }}</p>

    <form method="post" class="form-box mt-3">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-brand">Save changes</button>
      <a class="btn btn-outline-brand" href="{% url 'user_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
