{% extends "base.html" %}
{% block content %}
<div class="card card-body mx-auto" style="max-width: 420px">
  <h2>Log in</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
