{% extends "base.html" %}
{% block title %}Edit Cart | OmniRead{% endblock %}
{% block content %}
<div class="container py-4">
  <h1>Edit Cart</h1>
  <p>Select the ebooks you want in your cart. Saving removes unavailable titles.</p>
  <form class="panel" method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="d-flex align-items-center gap-3 mt-3">
      <button class="btn btn-brand" type="submit">Save selection</button>
      <a href="{% url 'cart:review' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
