<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OmniRead{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container flex-wrap gap-2">
    <a class="navbar-brand" href="{% url 'dashboard' %}">OmniRead</a>
    <div class="d-flex flex-wrap align-items-center gap-2">
      {% if user.is_authenticated %}
        {% if user.role == "ADMIN" %}
          <a class="nav-link text-light" href="{% url 'admin_dashboard' %}">Admin Dashboard</a>
        {% else %}
          <a class="nav-link text-light" href="{% url 'reader_dashboard' %}">My Dashboard</a>
        {% endif %}
        <a class="nav-link text-light" href="{% url 'profile' %}">Profile</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm">Log out</button>
        </form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
        <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
